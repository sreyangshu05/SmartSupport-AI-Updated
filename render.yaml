# Render Blueprint for the Render backend + Neon PostgreSQL + Vercel frontend setup.
# Enter DATABASE_URL and the frontend URL values in the Render dashboard.
services:
  - type: web
    name: smartsupport-api
    runtime: docker
    plan: free
    dockerfilePath: ./backend/Dockerfile
    dockerContext: ./backend
    healthCheckPath: /api/health
    envVars:
      - key: ENV
        value: production
      - key: DATABASE_URL
        sync: false
      - key: REDIS_ENABLED
        value: "false"
      - key: SECRET_KEY
        generateValue: true
      - key: CORS_ORIGINS
        sync: false
      - key: FRONTEND_URL
        sync: false
      - key: AI_ENABLED
        value: "false"
      - key: AI_PROVIDER
        value: openai_compat
      - key: AI_BASE_URL
        value: https://api.openai.com/v1
      - key: AI_API_KEY
        sync: false
      - key: AI_CHAT_MODEL
        value: gpt-4o-mini
      - key: AI_EMBEDDING_MODEL
        value: text-embedding-3-small
      - key: SEED_DATA
        value: "false"

