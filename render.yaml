# Render Blueprint
# Deploy from the repository root. Fill the sync:false values in the Render dashboard.
services:
  - type: web
    name: smartsupport-api
    runtime: docker
    plan: free
    dockerfilePath: ./backend/Dockerfile
    dockerContext: ./backend
    healthCheckPath: /api/health
    envVars:
      - key: ENV
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: smartsupport-db
          property: connectionString
      - key: REDIS_URL
        fromService:
          type: redis
          name: smartsupport-redis
          property: connectionString
      - key: REDIS_ENABLED
        value: "true"
      - key: SECRET_KEY
        generateValue: true
      - key: CORS_ORIGINS
        sync: false
      - key: FRONTEND_URL
        sync: false
      - key: AI_ENABLED
        value: "false"
      - key: AI_PROVIDER
        value: openai_compat
      - key: AI_BASE_URL
        value: https://api.openai.com/v1
      - key: AI_API_KEY
        sync: false
      - key: AI_CHAT_MODEL
        value: gpt-4o-mini
      - key: AI_EMBEDDING_MODEL
        value: text-embedding-3-small
      - key: SEED_DATA
        value: "false"

  - type: web
    name: smartsupport-frontend
    runtime: static
    plan: free
    buildCommand: npm ci && npm run build
    staticPublishPath: ./frontend/dist
    rootDir: frontend
    envVars:
      - key: VITE_API_BASE_URL
        sync: false

databases:
  - name: smartsupport-db
    plan: free
    databaseName: smartsupport
    user: smartuser

  - name: smartsupport-redis
    type: redis
    plan: free
